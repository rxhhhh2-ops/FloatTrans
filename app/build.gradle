plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sonetto.floattrans'
    compileSdk 35

    defaultConfig {
        applicationId "com.sonetto.floattrans"
        minSdk 26
        targetSdk 33
        versionCode 8
        versionName "1.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
